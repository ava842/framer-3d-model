<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background: transparent;
    }
  </style>
</head>

<body>
  <model-viewer
    src="Chair%20GLB.glb"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1">
  </model-viewer>
</body>
</html>
